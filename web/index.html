<!doctype html>
<html lang="ru">
<head>

          <circle cx="21.6" cy="22.6" r="22" fill="url(#lglow)"/>

  <div id="miniplayer" hidden></div>
  <div id="toast" hidden></div>

  <script src="js/app.js"></script>

</html>
