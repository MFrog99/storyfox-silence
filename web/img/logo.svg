<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Знак StoryFox Silence: лиса с закрытыми глазами (медитация) и месяц -->
  <defs>
    <linearGradient id="sfFur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2CD93"/>
      <stop offset="0.55" stop-color="#E5A978"/>
      <stop offset="1" stop-color="#C8765C"/>
    </linearGradient>
    <linearGradient id="sfMoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EAD0"/>
      <stop offset="1" stop-color="#E3C08D"/>
    </linearGradient>
  </defs>
  <!-- месяц -->
  <path d="M84 6a12 12 0 1 0 12 15A9.5 9.5 0 1 1 84 6z" fill="url(#sfMoon)"/>
  <circle cx="72" cy="8" r="1.3" fill="#F6EAD0" opacity=".85"/>
  <circle cx="95" cy="33" r="1" fill="#F6EAD0" opacity=".6"/>
  <!-- голова -->
  <path d="M18 20 L38 41 Q50 36 62 41 L82 20 Q90 44 85 59 Q77 77 50 92 Q23 77 15 59 Q10 44 18 20Z" fill="url(#sfFur)"/>
  <!-- уши -->
  <path d="M22.5 29 L35 42.5 L27.5 47Z" fill="#7A4535" opacity=".5"/>
  <path d="M77.5 29 L65 42.5 L72.5 47Z" fill="#7A4535" opacity=".5"/>
  <!-- светлая маска с пушистыми щеками -->
  <path d="M15 59 Q22 55 29 57 Q36 59 41 65 Q46 71 50 72 Q54 71 59 65 Q64 59 71 57 Q78 55 85 59 Q83 63 79 66 Q81 67 82 66 Q76 76 50 92 Q24 76 18 66 Q19 67 21 66 Q17 63 15 59Z" fill="#F8F0E1"/>
  <!-- закрытые глаза -->
  <path d="M30 55.5 Q36 61 42 55.5" fill="none" stroke="#2A1E19" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M58 55.5 Q64 61 70 55.5" fill="none" stroke="#2A1E19" stroke-width="2.8" stroke-linecap="round"/>
  <!-- нос -->
  <path d="M46.3 73 Q50 71.3 53.7 73 Q52.2 77.2 50 77.8 Q47.8 77.2 46.3 73Z" fill="#2A1E19"/>
</svg>
