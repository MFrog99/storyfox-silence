plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Ключ подписи релиза лежит в android/keystore.properties (не публикуйте его)
def keyProps = new Properties()
def keyFile = rootProject.file('keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'ru.storyfox.silence'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.storyfox.silence'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            // Python 3.12 в Chaquopy есть только для 64-битных ABI
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Общий интерфейс из ../../web кладётся в assets как есть
    sourceSets {
        main {
            assets.srcDirs += ['../../web']
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        def py = System.getenv('BUILD_PYTHON')
        if (py) buildPython(py)
        pip {
            install 'requests[socks]'
            install 'typing-extensions>=4.4.0'
        }
    }
    // Общий сервис и библиотека yandex-music
    sourceSets {
        main {
            srcDir '../../core'
            srcDir '../../vendor'
        }
    }
}
